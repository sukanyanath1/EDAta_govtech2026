[project]
name = "EDAtaBot"
version = "0.2.0"
description = "EDAtaBot project"
readme = "README.md"
requires-python = "==3.12.11"

dependencies = [
    "langchain==1.2.15",
    "openai==2.31.0",
    "langchain_core==1.2.31",
    "python-dotenv==1.1.0",
    "langchain_openai==1.1.14",
    "ftfy==6.3.1",
    "fastapi==0.116.1",
    "uvicorn==0.35.0",
    "pydantic_settings==2.10.1",
    "pandas==2.3.2",
    "azure-storage-blob==12.27.0",
    "azure-storage-file-datalake==12.22.0",
    "langchain-classic==1.0.3",
    "ruff==0.12.11",
    "pre-commit==4.3.0"
    
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", 
]

pydocstyle.convention = "google"
